/* ============================================================
   AI English Learning App — Brand CSS
   Style: Fresh Modern Education (清新现代教育风)
   Primary hue: Teal
   ============================================================ */

/* ---- Design Tokens ---- */
:root {
  /* Brand primary scale (teal) */
  --en-primary-50: #f0fdfa;
  --en-primary-100: #ccfbf1;
  --en-primary-200: #99f6e4;
  --en-primary-300: #5eead4;
  --en-primary-400: #2dd4bf;
  --en-primary-500: #14b8a6;
  --en-primary-600: #0d9488;
  --en-primary-700: #0f766e;
  --en-primary-800: #115e59;
  --en-primary-900: #134e4a;

  /* Neutral scale (slate) */
  --en-neutral-50: #f8fafc;
  --en-neutral-100: #f1f5f9;
  --en-neutral-200: #e2e8f0;
  --en-neutral-300: #cbd5e1;
  --en-neutral-400: #94a3b8;
  --en-neutral-500: #64748b;
  --en-neutral-600: #475569;
  --en-neutral-700: #334155;
  --en-neutral-800: #1e293b;
  --en-neutral-900: #0f172a;

  /* State colors (semantic only) */
  --state-success: #16a34a;
  --state-success-light: #dcfce7;
  --state-warning: #d97706;
  --state-warning-light: #fef3c7;
  --state-error: #dc2626;
  --state-error-light: #fee2e2;
  --state-info: #2563eb;
  --state-info-light: #dbeafe;

  /* Radius scale */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Typography */
  --en-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --en-font-mono: "JetBrains Mono", "SF Mono", "Consolas", monospace;

  /* ---- Semantic aliases (light mode) ---- */
  --en-background: #ffffff;
  --en-foreground: #0f172a;
  --en-card: #ffffff;
  --en-card-foreground: #0f172a;
  --en-popover: #ffffff;
  --en-popover-foreground: #0f172a;
  --en-primary: #0d9488;
  --en-primary-foreground: #ffffff;
  --en-muted: #f1f5f9;
  --en-muted-foreground: #64748b;
  --en-border: #e2e8f0;
  --en-input: #e2e8f0;
  --en-ring: #0d9488;

  /* Radius aliases */
  --en-radius-small: 4px;
  --en-radius-medium: 8px;
  --en-radius-large: 16px;

  /* Shadows — static surfaces only, alpha <= 0.05 */
  --en-shadow-1: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 1px rgba(15, 23, 42, 0.03);
  /* Floating layers — deeper elevation allowed */
  --en-shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.18);
  --en-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.30);
}

/* ---- Dark mode semantic aliases ---- */
html.dark {
  --en-background: #0f172a;
  --en-foreground: #f8fafc;
  --en-card: #1e293b;
  --en-card-foreground: #f8fafc;
  --en-popover: #1e293b;
  --en-popover-foreground: #f8fafc;
  --en-primary: #14b8a6;
  --en-primary-foreground: #ffffff;
  --en-muted: #1e293b;
  --en-muted-foreground: #94a3b8;
  --en-border: #334155;
  --en-input: #334155;
  --en-ring: #14b8a6;

  --en-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.20), 0 1px 1px rgba(0, 0, 0, 0.10);
  --en-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.40);
  --en-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.50);
}

/* ---- Base typography ---- */
body {
  font-family: var(--en-font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

/* Tabular nums for data/metrics */
.nums {
  font-variant-numeric: tabular-nums;
}

}

    <style id="critical-layout">
      .page-root { min-height: 100vh; background: var(--en-background); display: flex; flex-direction: column; }
      .content-frame { max-width: 448px; margin: 0 auto; width: 100%; flex: 1; }
      .content-stack { display: flex; flex-direction: column; gap: 16px; padding: 16px; }
      .app-header { position: sticky; top: 0; z-index: 20; height: 56px; background: var(--en-card); border-bottom: 1px solid var(--en-border); }
      .app-header-inner { max-width: 448px; margin: 0 auto; height: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
      .tab-selector { display: flex; gap: 8px; }
      .sentence-card { background: var(--en-card); border: 1px solid var(--en-border); border-radius: 8px; padding: 16px; }
      .result-feedback { background: var(--en-card); border: 1px solid var(--en-border); border-radius: 8px; padding: 16px; }
      .action-buttons { display: flex; gap: 8px; }
      .action-buttons > button { flex: 1; }
      .nav-controls { display: flex; gap: 8px; }
      .nav-controls > button { flex: 1; }
      .bottom-nav { position: sticky; bottom: 0; z-index: 20; height: 56px; background: var(--en-card); border-top: 1px solid var(--en-border); }
      [data-mobile-nav="global"] { position: sticky; bottom: 0; width: 100%; }
      [data-mobile-nav="global"] > div { max-width: 448px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: 100%; }
      [data-mobile-nav="global"] button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0 4px; height: 100%; }
      [data-mobile-nav="global"] button span { font-size: 11px; line-height: 1; white-space: nowrap; }
      .blank-input { display: inline-block; width: 96px; height: 28px; text-align: center; background: transparent; border: none; border-bottom: 2px solid var(--en-primary); outline: none; font-family: inherit; font-size: 15px; color: var(--en-foreground); vertical-align: baseline; margin: 0 2px; }
      .blank-input::placeholder { color: var(--en-muted-foreground); }
      .blank-input:focus { border-bottom-color: var(--en-ring); }
      .btn { transition: background-color 150ms cubic-bezier(.2,.8,.2,1), color 150ms cubic-bezier(.2,.8,.2,1), border-color 150ms cubic-bezier(.2,.8,.2,1), opacity 150ms cubic-bezier(.2,.8,.2,1); cursor: pointer; }
      .btn-primary { background: var(--en-primary); color: var(--en-primary-foreground); }
      .btn-primary:hover { background: var(--en-primary-700); }
      .btn-primary:active { background: var(--en-primary-800); }
      .btn-secondary { background: transparent; color: var(--en-foreground); border: 1px solid var(--en-border); }
      .btn-secondary:hover { background: var(--en-muted); }
      .btn-secondary:active { opacity: 0.85; }
      .tab-active { background: var(--en-primary); color: var(--en-primary-foreground); transition: background-color 150ms cubic-bezier(.2,.8,.2,1); cursor: pointer; }
      .tab-active:hover { background: var(--en-primary-700); }
      .tab-inactive { background: var(--en-muted); color: var(--en-muted-foreground); transition: background-color 150ms cubic-bezier(.2,.8,.2,1), color 150ms cubic-bezier(.2,.8,.2,1); cursor: pointer; }
      .tab-inactive:hover { color: var(--en-foreground); }
      .dictation-input { transition: border-color 150ms cubic-bezier(.2,.8,.2,1), box-shadow 150ms cubic-bezier(.2,.8,.2,1); }
      .dictation-input:focus { border-color: var(--en-ring); box-shadow: 0 0 0 2px color-mix(in srgb, var(--en-ring) 20%, transparent); }
      .audio-btn { transition: background-color 150ms cubic-bezier(.2,.8,.2,1); cursor: pointer; }
      .audio-btn:hover { background: color-mix(in srgb, var(--en-primary) 18%, transparent); }
      .translation-toggle { transition: color 150ms cubic-bezier(.2,.8,.2,1); cursor: pointer; }
      .translation-toggle:hover { color: var(--en-foreground); }
      .icon-btn { transition: background-color 150ms cubic-bezier(.2,.8,.2,1); cursor: pointer; }
      .icon-btn:hover { background: var(--en-muted); }
      @media (prefers-reduced-motion: reduce) {
        * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
      }
    </style>
    <div class="page-root">
      <header class="app-header">
        <div class="app-header-inner">
          <a href="#" data-dom-id="back-article-list" class="icon-btn flex items-center justify-center w-9 h-9 rounded-md" style="color: var(--en-foreground);" aria-label="返回">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
          </a>
          <h1 class="text-[16px] font-semibold" style="color: var(--en-foreground);">听力训练</h1>
          <span class="text-[15px] font-medium nums" style="color: var(--en-primary);">5 / 15</span>
        </div>
      </header>

      <div class="content-frame">
        <div class="content-stack">
          <section class="flex flex-col gap-3">
            <div class="w-full rounded-full overflow-hidden" style="height: 6px; background: var(--en-muted);">
              <div class="h-full rounded-full" style="width: 33%; background: var(--en-primary);"></div>
            </div>
            <div class="grid grid-cols-3 gap-2">
              <div class="flex items-center gap-1.5 min-w-0">
                <i data-lucide="target" class="w-4 h-4 shrink-0" style="color: var(--state-success);"></i>
                <span class="text-[13px] truncate" style="color: var(--en-foreground);">正确率 85%</span>
              </div>
              <div class="flex items-center gap-1.5 min-w-0">
                <i data-lucide="clock" class="w-4 h-4 shrink-0" style="color: var(--en-muted-foreground);"></i>
                <span class="text-[13px] truncate" style="color: var(--en-foreground);">用时 12分</span>
              </div>
              <div class="flex items-center gap-1.5 min-w-0">
                <i data-lucide="flame" class="w-4 h-4 shrink-0" style="color: var(--state-warning);"></i>
                <span class="text-[13px] truncate" style="color: var(--en-foreground);">连续 3题</span>
              </div>
            </div>
          </section>

          <div class="tab-selector">
            <button data-tab-key="sentence" class="tab-active inline-flex items-center justify-center px-4 h-9 rounded-full text-[14px] font-medium whitespace-nowrap">逐句精听</button>
            <button data-tab-key="dictation" class="tab-inactive inline-flex items-center justify-center px-4 h-9 rounded-full text-[14px] font-medium whitespace-nowrap">听写填空</button>
          </div>

          <div class="sentence-card">
            <div class="flex items-center justify-between mb-3">
              <span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium" style="background: color-mix(in srgb, var(--en-primary) 10%, transparent); color: var(--en-primary);">第 6 句</span>
              <button class="audio-btn flex items-center gap-2" aria-label="播放音频">
                <span class="flex items-center justify-center w-10 h-10 rounded-full" style="background: color-mix(in srgb, var(--en-primary) 10%, transparent); color: var(--en-primary);">
                  <i data-lucide="volume-high" class="w-5 h-5"></i>
                </span>
                <span class="text-[13px]" style="color: var(--en-muted-foreground);">点击播放</span>
              </button>
            </div>
            <p class="text-[15px] leading-relaxed" style="color: var(--en-foreground);">
              The <input type="text" class="blank-input" value="result" /> of procrastination is not <input type="text" class="blank-input" placeholder="___" />, but the <input type="text" class="blank-input" placeholder="___" /> that builds over time.
            </p>
            <button class="translation-toggle flex items-center gap-1 mt-3 text-[13px]" style="color: var(--en-muted-foreground);">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
              <span>显示译文</span>
            </button>
          </div>

          <section class="flex flex-col gap-2">
            <label class="text-[13px]" style="color: var(--en-muted-foreground);">听写完整句子</label>
            <textarea class="dictation-input w-full rounded-md p-3 text-[15px] resize-none outline-none" style="min-height: 80px; background: var(--en-background); border: 1px solid var(--en-border); color: var(--en-foreground);" placeholder="听写你听到的完整句子..."></textarea>
            <div class="flex justify-end">
              <span class="text-[12px]" style="color: var(--en-muted-foreground);">0 字符</span>
            </div>
          </section>

          <div class="action-buttons">
            <button class="btn btn-secondary inline-flex items-center justify-center gap-1.5 h-11 rounded-md text-[15px] font-medium">
              <i data-lucide="play" class="w-4 h-4"></i>
              <span>播放原文</span>
            </button>
            <button class="btn btn-primary inline-flex items-center justify-center gap-1.5 h-11 rounded-md text-[15px] font-medium">
              <i data-lucide="check" class="w-4 h-4"></i>
              <span>提交答案</span>
            </button>
          </div>

          <div class="result-feedback">
            <div class="flex items-center gap-2 mb-3">
              <i data-lucide="check-circle" class="w-4 h-4 shrink-0" style="color: var(--state-success);"></i>
              <span class="text-[15px] font-semibold" style="color: var(--state-success);">正确!</span>
              <span class="text-[14px]" style="color: var(--en-foreground);">2 / 3 空格正确</span>
            </div>
            <div class="flex flex-col gap-2">
              <div class="flex items-center gap-2 text-[14px]">
                <span class="font-medium w-4 shrink-0" style="color: var(--en-muted-foreground);">1.</span>
                <span style="color: var(--state-success);">result</span>
                <i data-lucide="check" class="w-4 h-4 shrink-0" style="color: var(--state-success);"></i>
              </div>
              <div class="flex items-center gap-2 text-[14px] flex-wrap">
                <span class="font-medium w-4 shrink-0" style="color: var(--en-muted-foreground);">2.</span>
                <span class="line-through" style="color: var(--state-error);">effort</span>
                <span style="color: var(--en-muted-foreground);">&rarr;</span>
                <span style="color: var(--state-success);">laziness</span>
                <i data-lucide="check" class="w-4 h-4 shrink-0" style="color: var(--state-success);"></i>
              </div>
              <div class="flex items-center gap-2 text-[14px]">
                <span class="font-medium w-4 shrink-0" style="color: var(--en-muted-foreground);">3.</span>
                <span style="color: var(--state-success);">anxiety</span>
                <i data-lucide="check" class="w-4 h-4 shrink-0" style="color: var(--state-success);"></i>
              </div>
            </div>
            <div class="rounded-md p-2 mt-3 text-[15px] leading-relaxed" style="background: color-mix(in srgb, var(--en-muted) 30%, transparent); color: var(--en-foreground);">
              The result of procrastination is not laziness, but the anxiety that builds over time.
            </div>
          </div>

          <div class="nav-controls">
            <button class="btn btn-secondary inline-flex items-center justify-center gap-1 h-10 rounded-md text-[14px] font-medium">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
              <span>上一句</span>
            </button>
            <button class="btn btn-primary inline-flex items-center justify-center gap-1 h-10 rounded-md text-[14px] font-medium">
              <span>下一句</span>
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </div>

      <nav data-mobile-nav="global" class="sticky bottom-0 w-full bg-card border-t border-border" style="height:56px"><div class="w-full max-w-md mx-auto grid grid-cols-3 h-full"><button data-nav-key="articles" data-active="true" class="flex flex-col items-center justify-center gap-0.5 px-1 h-full text-primary"><i data-lucide="library" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap">文章</span></button><button data-nav-key="discover" class="flex flex-col items-center justify-center gap-0.5 px-1 h-full text-muted-foreground"><i data-lucide="compass" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap">发现</span></button><button data-nav-key="mine" data-dom-id="cta-ai-config" class="flex flex-col items-center justify-center gap-0.5 px-1 h-full text-muted-foreground"><i data-lucide="user" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap">我的</span></button></div></nav>
    </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
