/* ============================================================
   AI English Learning App — Brand CSS
   Style: Fresh Modern Education (清新现代教育风)
   Primary hue: Teal
   ============================================================ */

/* ---- Design Tokens ---- */
:root {
  /* Brand primary scale (teal) */
  --en-primary-50: #f0fdfa;
  --en-primary-100: #ccfbf1;
  --en-primary-200: #99f6e4;
  --en-primary-300: #5eead4;
  --en-primary-400: #2dd4bf;
  --en-primary-500: #14b8a6;
  --en-primary-600: #0d9488;
  --en-primary-700: #0f766e;
  --en-primary-800: #115e59;
  --en-primary-900: #134e4a;

  /* Neutral scale (slate) */
  --en-neutral-50: #f8fafc;
  --en-neutral-100: #f1f5f9;
  --en-neutral-200: #e2e8f0;
  --en-neutral-300: #cbd5e1;
  --en-neutral-400: #94a3b8;
  --en-neutral-500: #64748b;
  --en-neutral-600: #475569;
  --en-neutral-700: #334155;
  --en-neutral-800: #1e293b;
  --en-neutral-900: #0f172a;

  /* State colors (semantic only) */
  --state-success: #16a34a;
  --state-success-light: #dcfce7;
  --state-warning: #d97706;
  --state-warning-light: #fef3c7;
  --state-error: #dc2626;
  --state-error-light: #fee2e2;
  --state-info: #2563eb;
  --state-info-light: #dbeafe;

  /* Radius scale */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Typography */
  --en-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --en-font-mono: "JetBrains Mono", "SF Mono", "Consolas", monospace;

  /* ---- Semantic aliases (light mode) ---- */
  --en-background: #ffffff;
  --en-foreground: #0f172a;
  --en-card: #ffffff;
  --en-card-foreground: #0f172a;
  --en-popover: #ffffff;
  --en-popover-foreground: #0f172a;
  --en-primary: #0d9488;
  --en-primary-foreground: #ffffff;
  --en-muted: #f1f5f9;
  --en-muted-foreground: #64748b;
  --en-border: #e2e8f0;
  --en-input: #e2e8f0;
  --en-ring: #0d9488;

  /* Radius aliases */
  --en-radius-small: 4px;
  --en-radius-medium: 8px;
  --en-radius-large: 16px;

  /* Shadows — static surfaces only, alpha <= 0.05 */
  --en-shadow-1: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 1px rgba(15, 23, 42, 0.03);
  /* Floating layers — deeper elevation allowed */
  --en-shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.18);
  --en-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.30);
}

/* ---- Dark mode semantic aliases ---- */
html.dark {
  --en-background: #0f172a;
  --en-foreground: #f8fafc;
  --en-card: #1e293b;
  --en-card-foreground: #f8fafc;
  --en-popover: #1e293b;
  --en-popover-foreground: #f8fafc;
  --en-primary: #14b8a6;
  --en-primary-foreground: #ffffff;
  --en-muted: #1e293b;
  --en-muted-foreground: #94a3b8;
  --en-border: #334155;
  --en-input: #334155;
  --en-ring: #14b8a6;

  --en-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.20), 0 1px 1px rgba(0, 0, 0, 0.10);
  --en-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.40);
  --en-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.50);
}

/* ---- Base typography ---- */
body {
  font-family: var(--en-font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

/* Tabular nums for data/metrics */
.nums {
  font-variant-numeric: tabular-nums;
}

}

@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.config-panel { background: var(--en-card); border: 1px solid var(--en-border); border-radius: 12px; padding: 24px; box-shadow: var(--en-shadow-1); margin-bottom: 24px; }
.config-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.config-icon { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; }
.config-icon.text-model { background: var(--en-primary-50); color: var(--en-primary); }
.config-icon.voice-model { background: var(--state-warning-light); color: var(--state-warning); }
.config-title-wrap { flex: 1; min-width: 0; }
.config-title { font-size: 16px; font-weight: 600; color: var(--en-foreground); margin: 0; }
.config-desc { font-size: 12px; color: var(--en-muted-foreground); margin-top: 2px; }
.config-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 9999px; font-size: 11px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
.config-badge.connected { background: var(--state-success-light); color: var(--state-success); }
.config-badge.disconnected { background: var(--en-muted); color: var(--en-muted-foreground); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.form-label { font-size: 13px; font-weight: 500; color: var(--en-muted-foreground); }
.form-label .optional { font-weight: 400; color: var(--en-neutral-400); margin-left: 4px; }
.input-wrapper { position: relative; width: 100%; }
.form-input { width: 100%; height: 44px; padding: 0 14px; border: 1px solid var(--en-border); border-radius: 8px; background: var(--en-background); color: var(--en-foreground); font-size: 15px; font-family: inherit; outline: none; box-sizing: border-box; transition: border-color 150ms cubic-bezier(.2,.8,.2,1), box-shadow 150ms cubic-bezier(.2,.8,.2,1); }

.form-input.password { padding-right: 44px; }
.toggle-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: none; background: transparent; color: var(--en-muted-foreground); cursor: pointer; border-radius: 4px; }

        <span style="width:36px"></span>
      </header>
      <div style="max-width:800px;margin:0 auto;padding:24px 32px">

        <!-- ====== 文字模型配置 ====== -->
        <div class="config-panel">
          <div class="config-header">
            <div class="config-icon text-model">
              <i data-lucide="type" style="width:22px;height:22px"></i>
            </div>
            <div class="config-title-wrap">
              <h2 class="config-title">文字模型</h2>
              <p class="config-desc">用于生词提取、文章摘要、理解问答</p>
            </div>
            <span class="config-badge connected"><i data-lucide="check" style="width:12px;height:12px"></i>已连接</span>
          </div>

          <div class="form-group">
            <label class="form-label">API Key</label>
            <div class="input-wrapper">
              <input type="password" class="form-input password" id="text-api-key" value="sk-proj-xxxxxxxxxxxxxxxxxxxx" />
              <button class="toggle-btn" data-target="text-api-key" type="button">
                <i data-lucide="eye" style="width:18px;height:18px"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Base URL<span class="optional">（可选）</span></label>
            <input type="text" class="form-input" id="text-base-url" placeholder="https://api.openai.com/v1" value="https://api.openai.com/v1" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">模型名称</label>
              <input type="text" class="form-input" id="text-model-name" placeholder="gpt-4o" value="gpt-4o" />
            </div>
            <div class="form-group">
              <label class="form-label">Max Tokens</label>
              <input type="number" class="form-input" id="text-max-tokens" value="4096" min="1" max="128000" />
            </div>
          </div>

          <div class="form-group">
            <div class="range-row">
              <label class="form-label">Temperature</label>
              <span class="range-value" id="text-temp-value">0.7</span>
            </div>
            <input type="range" class="range-input" id="text-temp-slider" min="0" max="2" step="0.1" value="0.7" />
          </div>

          <div class="config-actions">
            <button class="btn btn-secondary" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:8px;font-size:15px;font-weight:500" id="text-test-btn">
              <i data-lucide="activity" style="width:18px;height:18px"></i>
              <span>测试连接</span>
            </button>
            <button class="btn btn-primary" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:8px;font-size:15px;font-weight:500" id="text-save-btn">
              <i data-lucide="check" style="width:18px;height:18px"></i>
              <span>保存配置</span>
            </button>
          </div>

          <div class="connection-status ok" id="text-conn-status">
            <span class="status-dot ok"></span>
            <span style="font-size:14px;color:var(--en-foreground);font-weight:500">文字模型连接正常</span>
            <span style="font-size:13px;color:var(--en-muted-foreground);margin-left:auto">延迟 230ms</span>
          </div>
        </div>

        <!-- ====== 声音模型配置 ====== -->
        <div class="config-panel">
          <div class="config-header">
            <div class="config-icon voice-model">
              <i data-lucide="audio-lines" style="width:22px;height:22px"></i>
            </div>
            <div class="config-title-wrap">
              <h2 class="config-title">声音模型</h2>
              <p class="config-desc">用于生成文章语音、播客音频</p>
            </div>
            <span class="config-badge disconnected">未连接</span>
          </div>

          <div class="form-group">
            <label class="form-label">API Key</label>
            <div class="input-wrapper">
              <input type="password" class="form-input password" id="voice-api-key" placeholder="输入 API Key" />
              <button class="toggle-btn" data-target="voice-api-key" type="button">
                <i data-lucide="eye" style="width:18px;height:18px"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Base URL<span class="optional">（可选）</span></label>
            <input type="text" class="form-input" id="voice-base-url" placeholder="https://api.openai.com/v1" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">模型名称</label>
              <input type="text" class="form-input" id="voice-model-name" placeholder="tts-1" />
            </div>
            <div class="form-group">
              <label class="form-label">语音类型</label>
              <select class="form-select" id="voice-type">
                <option value="alloy">Alloy</option>
                <option value="echo">Echo</option>
                <option value="fable">Fable</option>
                <option value="onyx">Onyx</option>
                <option value="nova">Nova</option>
                <option value="shimmer">Shimmer</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">音频格式</label>
              <select class="form-select" id="audio-format">
                <option value="mp3">MP3</option>
                <option value="opus">Opus</option>
                <option value="aac">AAC</option>
                <option value="flac">FLAC</option>
              </select>
            </div>
            <div class="form-group">
              <div class="range-row">
                <label class="form-label">语速</label>
                <span class="range-value" id="voice-speed-value">1.0x</span>

              <input type="range" class="range-input" id="voice-speed-slider" min="0.5" max="2" step="0.1" value="1" />

              <i data-lucide="activity" style="width:18px;height:18px"></i>
              <span>测试连接</span>
            </button>

              <i data-lucide="check" style="width:18px;height:18px"></i>
              <span>保存配置</span>
            </button>
          </div>

          <div class="connection-status warn" id="voice-conn-status">
            <span class="status-dot warn"></span>
            <span style="font-size:14px;color:var(--en-foreground);font-weight:500">声音模型尚未配置</span>

          </div>
        </div>

      </div>
    </div>
    </main>
    <script>
      lucide.createIcons();

      // 通用：密码输入切换显示
      document.querySelectorAll('.toggle-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var targetId = btn.getAttribute('data-target');
          var input = document.getElementById(targetId);
          if (!input) return;
          if (input.type === 'password') {
            input.type = 'text';
            btn.innerHTML = '<i data-lucide="eye-off" style="width:18px;height:18px"></i>';
          } else {
            input.type = 'password';
            btn.innerHTML = '<i data-lucide="eye" style="width:18px;height:18px"></i>';
          }
          lucide.createIcons();
        });
      });

      // 文字模型 Temperature 滑块
      var textTempSlider = document.getElementById('text-temp-slider');
      var textTempValue = document.getElementById('text-temp-value');
      textTempSlider.addEventListener('input', function() {
        textTempValue.textContent = parseFloat(textTempSlider.value).toFixed(1);
      });

      // 声音模型 语速滑块
      var voiceSpeedSlider = document.getElementById('voice-speed-slider');
      var voiceSpeedValue = document.getElementById('voice-speed-value');
      voiceSpeedSlider.addEventListener('input', function() {
        voiceSpeedValue.textContent = parseFloat(voiceSpeedSlider.value).toFixed(1) + 'x';
      });

      // 通用：测试连接按钮
      function bindTestBtn(btnId) {
        var btn = document.getElementById(btnId);
        if (!btn) return;
        btn.addEventListener('click', function() {
          var originalHTML = btn.innerHTML;
          btn.innerHTML = '<i data-lucide="loader-2" style="width:18px;height:18px;animation:spin 1s linear infinite"></i><span>测试中...</span>';
          lucide.createIcons();
          setTimeout(function() {
            btn.innerHTML = originalHTML;
            lucide.createIcons();
          }, 1500);
        });
      }
      bindTestBtn('text-test-btn');
      bindTestBtn('voice-test-btn');
    </script>
</body>
</html>
